# 검증 게이트 — 잡들은 서로를 안 기다린다.
#
# **이미지 잡이 따로 있는 이유**: `apptainer.def` 가 깨져도 릴리스를 만들 때까지
# 안 드러난다. 그때는 배포하려던 자리다.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # **릴리스가 이 워크플로를 그대로 불러 쓴다**(`release.yml` 의 verify). 검증을
  # 릴리스 쪽에 한 벌 더 적으면 언젠가 한쪽만 고쳐지고, 그때부터 「CI 는 통과인데
  # 릴리스는 다른 것을 본다」 가 된다.
  workflow_call:
    inputs:
      skip_image:
        # 릴리스는 어차피 **같은 번들을 제 손으로 만든다**. 거기서 .def 가 깨지면
        # 그 자리에서 드러나므로, 검증에서 한 번 더 만들면 1 GB SIF 를 두 번 짓는
        # 것뿐이다(비공개 저장소는 분 단위로 값을 치른다).
        type: boolean
        default: false

jobs:
  backend:
    name: 백엔드 (ruff · mypy · pytest · alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/compcore
      APP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/compcore_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      # OCP(OpenCascade) 가 쓰는 시스템 라이브러리 — 없으면 build123d import 에서 죽는다.
      #
      # **apt 의 성공을 관문으로 삼지 않는다.** 예전에는 한 줄(`update && install`)이었는데
      # 러너에서 exit 100 으로 죽어 **백엔드 검증 전체가, 따라서 릴리스가 막혔다** — 정작
      # 필요한 것은 「apt 가 성공했는가」 가 아니라 「OCP 가 import 되는가」 다. 러너 이미지에
      # 이미 깔려 있을 수도 있고, 한 꾸러미가 그날 저장소에서 빠질 수도 있다.
      #
      # 그래서 여기서는 **최선을 다해 깔고 무엇이 됐는지 찍어만 둔다.** 진짜 판정은 아래
      # 「OCP 가 import 되는가」 가 한다 — 그것이 실패하면 이 로그가 까닭을 말해 준다.
      - name: OCP 가 쓰는 시스템 라이브러리 (실패해도 여기서 멈추지 않는다)
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=3 || sudo apt-get update -o Acquire::Retries=3
          for pkg in libgl1 libglu1-mesa libxrender1 libxext1; do
            sudo apt-get install -y --no-install-recommends "$pkg" \
              || { echo "::warning::$pkg 를 깔지 못했습니다"; apt-cache policy "$pkg" || true; }
          done

      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # **여기가 진짜 관문이다.** 시험이 형상을 만들려다 죽으면 그 오류는 CAD 커널이 아니라
      # 시험을 가리킨다 — 무엇이 없는지 여기서 먼저 말하게 한다.
      - name: OCP 가 import 되는가
        run: |
          python - <<'EOF'
          import build123d
          from build123d import Box
          print("build123d", build123d.__version__, "· 상자 부피", Box(1, 1, 1).volume)
          EOF
      - run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE compcore"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE compcore_test"
      - working-directory: backend
        run: |
          ruff format --check . ../mcp_server --config pyproject.toml
          ruff check . ../mcp_server --config pyproject.toml
          mypy
          python -m pytest
          alembic upgrade head
          alembic check
      # 생성물 최신성 — openapi.json 이 코드와 어긋나 있으면 프론트 타입이 옛것이다.
      - working-directory: backend
        run: python scripts/export_openapi.py && git diff --exit-code openapi.json

  mcp:
    name: MCP 서버 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - run: pip install -r mcp_server/requirements.txt pytest
      - run: python -m pytest mcp_server/tests

  frontend:
    name: 프론트 (build · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run api:types
          npm run build
          npm test
          npm run lint

  image:
    name: 이미지 (apptainer 빌드)
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      # 설치를 한 자리에서 정한다 — ci 와 release 가 같은 것을 쓴다.
      - uses: ./.github/actions/apptainer

      # **SIF 만 만들고 버린다.** 릴리스는 태그에서 따로 만든다 — 여기서 보려는 것은
      # 「.def 가 아직 빌드되는가」 하나다. CAD 커널(OCP)이 1 GB 를 넘어 오래 걸린다.
      #
      # 러너에는 subuid/subgid 매핑이 없어 비특권 빌드가 실패한다 — sudo 로 켠다.
      - name: 번들 빌드
        env:
          USE_SUDO_APPTAINER: '1'
        run: ./deploy/build_bundle.sh "ci-${{ github.sha }}"

      - name: 번들이 자기가 무슨 플랫폼인지 말하는가
        run: |
          info=$(find release -name BUILD_INFO | head -1)
          [ -n "$info" ] || { echo "BUILD_INFO 가 없습니다"; exit 1; }
          cat "$info"
          for key in app_name app_slug port mcp_port version; do
            grep -q "^$key=" "$info" || { echo "BUILD_INFO 에 $key 가 없습니다"; exit 1; }
          done
