# 릴리스 — 태그 하나를 밀면 **받아서 옮길 수 있는 tar.gz** 가 나온다.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# 이 자리가 없으면 배포 경로가 끊긴다. 번들을 만들려면 리눅스 · apptainer · npm 이
# 필요한데, **저장소를 받는 기계가 Windows 라면 그 기계에서 만들 수 없다** —
# Apptainer 는 Windows 네이티브 빌드가 없다. 그래서 만드는 일을 여기서 한다.
#
# **검증을 통과해야 릴리스가 나온다.** 안 그러면 아무도 안 돌려 본 코드가 tar 로
# 나가고, 그것이 깨졌다는 사실은 **운영 서버에서** 드러난다. 검증은 `ci.yml` 을 불러
# 쓴다 — 여기 한 벌 더 적으면 언젠가 한쪽만 고쳐진다.
#
# **같은 커밋이 main 에서 이미 통과했으면 다시 돌리지 않는다**(2026-10-22). 태그는 대개
# main 에 올리고 CI 가 초록인 것을 본 뒤에 민다 — 같은 코드를 같은 CI 로 두 번 돌려
# 릴리스마다 10분(예전에는 35분)을 더 기다렸다. 건너뛰는 것은 셋이 모두 맞을 때뿐이다:
#   - 태그가 가리키는 **바로 그 커밋(SHA)** 의 main push CI 가 `success`(이미지 빌드 포함)
#   - 그것이 **24시간 안**에 끝났다 — 백엔드 · 프런트 의존성은 버전이 박혀 있지만 MCP 서버의
#     것(`mcp_server/requirements.txt`)은 범위라, 오래된 CI 는 지금 받는 판을 안 본 것이다
#   - 그 결과를 읽을 수 있었다 — 못 읽으면(권한 · API 오류) 「통과 안 함」 으로 친다
# 하나라도 아니면 예전처럼 CI 전체를 여기서 돌린다. CI 가 아직 돌고 있을 때 민 태그도 그렇다.
# CI 가 **막 끝난** 직후에는 통과가 목록에 늦게 올라온다 — 20초 간격으로 네 번(1분)까지 묻는다
# (v0.16.5: CI 가 끝나고 40초 뒤에 물어 못 찾고, 같은 커밋의 CI 를 다시 10분 돌렸다).

name: Release

on:
  push:
    tags: ['v*']

# 릴리스를 만들려면 쓰기가 필요하다. 기본 토큰의 권한을 여기서만 넓힌다.
permissions:
  contents: write
  actions: read # 같은 커밋의 CI 결과를 읽는다(아래 ci-passed)

jobs:
  ci-passed:
    name: 같은 커밋의 CI 결과
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          query="repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push&status=success&per_page=20"
          # 못 읽으면 0 — 「통과 안 함」 으로 쳐서 CI 를 여기서 돌린다(릴리스를 막지 않는다).
          # 막 끝난 CI 는 목록에 늦게 올라온다 — 못 찾으면 20초 뒤에 다시, 네 번까지.
          for attempt in 1 2 3 4; do
            found=$(gh api "$query" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .updated_at >= \"$since\")] | length" 2>/dev/null) || found=0
            if [ "${found:-0}" -gt 0 ] 2>/dev/null; then break; fi
            if [ "$attempt" -lt 4 ]; then echo "아직 못 찾음($attempt/4) — 20초 뒤 다시"; sleep 20; fi
          done
          if [ "${found:-0}" -gt 0 ] 2>/dev/null; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "같은 커밋(${{ github.sha }})의 main CI 가 24시간 안에 통과했다 — 다시 돌리지 않는다."
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "같은 커밋의 통과한 CI 가 없다(또는 24시간이 지났다) — 여기서 CI 전체를 돌린다."
          fi

  verify:
    name: 검증 (CI 전체)
    needs: ci-passed
    if: needs.ci-passed.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml
    # 이미지는 아래 release 잡이 진짜 번들을 만들며 짓는다 — 여기서 또 지으면
    # 같은 SIF 를 두 번 만든다.
    with:
      skip_image: true

  release:
    name: 번들 빌드 · 릴리스 게시
    needs: [ci-passed, verify]
    # verify 를 건너뛰면 기본으로는 이 잡도 건너뛴다 — 「이미 통과했다」 이거나 「여기서 돌려
    # 통과했다」 일 때만 간다. 둘 다 아니면(실패 · 취소) 나가지 않는다.
    if: >-
      !cancelled() && needs.ci-passed.result == 'success'
      && (needs.ci-passed.outputs.passed == 'true' || needs.verify.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      # 설치를 한 자리에서 정한다 — ci 와 release 가 같은 것을 쓴다.
      - uses: ./.github/actions/apptainer

      # **버전은 태그다.** `git describe` 에 맡기면 얕은 체크아웃에서 엉뚱한 값이
      # 나오고, 그 값이 BUILD_INFO 를 거쳐 `/api/health` 까지 간다 — 「지금 서버에
      # 뭐가 깔렸나」 를 묻는 유일한 자리다.
      #
      # 러너에는 subuid/subgid 매핑이 없어 비특권 빌드가 실패한다 — sudo 로 켠다.
      - name: 번들 빌드
        env:
          USE_SUDO_APPTAINER: '1'
        run: ./deploy/build_bundle.sh "${GITHUB_REF_NAME}"

      # 나가기 전에 **번들이 자기 발로 서는지** 본다. 여기서 빠진 파일은 서버에서
      # `deploy.sh` 가 멈추는 것으로 드러나고, 그때는 SSH 로 붙어 있는 자리다.
      - name: 번들이 온전한가
        run: |
          set -euo pipefail
          tar tzf release/*.tar.gz | sed 's|^[^/]*/||' | sort > /tmp/have.txt
          for f in app.sif deploy.sh ha.sh pg-ha.sh backup.sh restore.sh \
                   app.service.template worker.service.template mcp.service.template \
                   backup.service.template backup.timer.template \
                   .env.example BUILD_INFO README.md 쉬운-설치.md; do
            grep -qx "$f" /tmp/have.txt || { echo "번들에 $f 가 없습니다"; exit 1; }
          done
          # **MCP 서버는 SIF 밖에 산다**(백엔드와 의존성이 충돌한다). 소스와 가이드가
          # 빠지면 AI 도구는 붙고 나서야 빈 가이드를 받는다 — 그때는 사용자 자리다.
          # 기준정보 도구(`ontology*.py`)는 server.py 가 import 한다 — 빠지면 뜨자마자 죽는다.
          for f in mcp_server/server.py mcp_server/requirements.txt mcp_server/guide/GUIDE.md \
                   mcp_server/ontology.py mcp_server/ontology_links.py \
                   mcp_server/guide/ONTOLOGY.md; do
            grep -qx "$f" /tmp/have.txt || { echo "번들에 $f 가 없습니다"; exit 1; }
          done
          grep -q '^mcp_server/wheels/' /tmp/have.txt \
            || { echo "MCP 오프라인 휠이 없습니다 — 폐쇄망 서버에서 설치가 멈춥니다"; exit 1; }
          info=$(find release -name BUILD_INFO | head -1)
          for key in app_name app_slug port mcp_port version; do
            grep -q "^$key=" "$info" || { echo "BUILD_INFO 에 $key 가 없습니다"; exit 1; }
          done
          grep -q "^version=${GITHUB_REF_NAME}$" "$info" \
            || { echo "BUILD_INFO 의 version 이 태그와 다릅니다"; exit 1; }
          cat "$info"

      # **줄바꿈을 여기서 한 번 더 본다.** Windows 에서 만진 스크립트가 CRLF 로
      # 들어오면 서버에서 `bad interpreter: /usr/bin/env bash^M` 로 죽는데, 그
      # 메시지는 무엇을 고쳐야 하는지 말해 주지 않는다. `.gitattributes` 가 막지만,
      # **막혔는지 확인하는 자리는 나가는 문**이어야 한다.
      - name: 번들 스크립트가 LF 인가
        run: |
          set -euo pipefail
          dir=$(find release -maxdepth 1 -type d -name '*-*' | head -1)
          [ -n "$dir" ] && ls "$dir"/*.sh >/dev/null 2>&1 || { echo "번들 폴더 · 스크립트를 찾지 못했습니다"; exit 1; }
          for sh in "$dir"/*.sh; do
            if grep -qU $'\r' "$sh"; then
              echo "$sh 에 CRLF 가 있습니다 — 서버에서 bad interpreter 로 죽습니다"
              exit 1
            fi
            [ -x "$sh" ] || { echo "$sh 에 실행 비트가 없습니다"; exit 1; }
          done
          echo "LF · 실행 비트 확인"

      # 서드파티 액션을 안 쓴다. `gh` 는 러너에 이미 있다 — 의존을 하나 안 늘리는
      # 쪽이, 그 액션이 어느 날 안 돌 때 여기를 들여다볼 일도 없앤다.
      - name: 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball=$(ls release/*.tar.gz)
          sha=$(ls release/*.tar.gz.sha256)
          base=$(basename "$tarball")

          # **절차를 여기 옮겨 적지 않는다.** 정본은 번들 안의 README 다. 두 벌이
          # 되면 한쪽만 고쳐지고, 그때부터 사람마다 다른 순서를 밟는다. 여기 적는
          # 것은 **이 릴리스에서만 다른 것**(파일 이름)뿐이다.
          {
            printf '설치 절차의 정본은 번들 안의 `README.md` 입니다.\n\n'
            printf '받는 PC 에서는 `deploy/pc/fetch-release.sh`(맥 · 리눅스) 또는\n'
            printf '`fetch-release.bat`(윈도우)이 버전을 골라 받고 체크섬까지 맞춰 봅니다.\n\n'
            printf '```bash\n'
            printf '# 받는 PC 에서\n'
            printf './fetch-release.sh -v %s\n' "${GITHUB_REF_NAME}"
            printf 'scp downloads/%s* <계정>@<서버>:~/\n' "$base"
            printf '\n# 서버에서\n'
            printf 'ssh <계정>@<서버>\n'
            printf 'sha256sum -c %s.sha256\n' "$base"
            printf 'tar xzf %s && cd %s\n'    "$base" "${base%.tar.gz}"
            printf 'sudo ./deploy.sh prepare   # 최초 1회\n'
            printf 'sudo ./deploy.sh install   # 이후로는 update\n'
            printf '```\n\n'
            printf '**푼 뒤가 아니라 옮긴 직후에 체크섬을 맞춥니다** — 절반만 받아진 tar 는\n'
            printf '푸는 순간에야 드러나고, 그때는 배포하려고 서버에 붙어 있는 자리입니다.\n'
          } > "$RUNNER_TEMP/notes.md"

          gh release create "${GITHUB_REF_NAME}" "$tarball" "$sha" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "게시 완료: ${GITHUB_REF_NAME}"
