[project]
name = "compcore-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

# 의존성 정본은 requirements.txt 다. 폐쇄망 배포가 `pip wheel -r requirements.txt`
# 로 wheel 번들을 만들므로 전이 의존성까지 고정된 파일이 하나 있어야 한다.

[tool.ruff]
line-length = 95
# SP 코어 연동 키트(`coreapi/kit`)는 **상대 시스템에서 도는 코드**다 — 이 저장소의 규칙이 아니라
# 「의존성 하나로 복사해 쓰는 한 파일」 이 기준이라 검사에서 뺀다(StandardPlatform 과 같다).
extend-exclude = ["app/modules/coreapi/kit"]
target-version = "py312"
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 화면 문구의 작은따옴표(AGENTS.md 「화면 문구」) — 화면 요소 · 이름을 ‘’ 로 가리킨다.
# `›` · `σ` · `ρ` · `α` 는 StandardPlatform 에서 들인 온톨로지 · 분석이 화면에 그대로 내는 구분자 ·
# 통계 기호다(ADR 0008) — 「개발사 › 국가」, 관리도의 「2σ 밖」.
allowed-confusables = ["‘", "’", "›", "σ", "ρ", "α"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입은 기본값 자리에 Depends() 를 쓰는 것이 정식 문법이라
# B008 이 전부 오탐이 된다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007"]
# 비교키 정규화는 **전각 · 유사 문자 자체가 소재**다(StandardPlatform 에서 들임 — ADR 0008).
"app/shared/text.py" = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
exclude = "app/modules/coreapi/kit/"

[[tool.mypy.overrides]]
module = ["uvicorn.*", "cairosvg.*"]
ignore_missing_imports = true

# openpyxl 은 타입 스텁을 따로 배포한다(types-openpyxl). 표 읽기 · 쓰기(`shared/sheets.py`)
# 한 자리라 여기서만 모르는 것으로 둔다(StandardPlatform 과 같다 — ADR 0008).
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

# scipy 는 타입 표시(`py.typed`)가 없다. 지표(`metrics/recipes/_numeric.py`) 한 자리에서만 부르고
# 결과를 거기서 float · ndarray 로 바꿔 내보낸다(StandardPlatform 과 같다 — ADR 0008).
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# build123d 는 타입 정보가 부분적이라(OCP 바인딩) strict 로 보면 Any 가 흘러넘친다.
# 코어(`app/core`)는 그 경계를 감싸는 층이므로 여기서만 느슨하게 본다.
[[tool.mypy.overrides]]
module = ["build123d.*", "OCP.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["app.core.*"]
disallow_any_unimported = false
warn_return_any = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
